<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNC Studio</title></head><body style="font:18px/1.5 -apple-system,Roboto,sans-serif;text-align:center;padding:40px 20px">
<p id="t">Đang mở mô hình…</p><script>(function(){
  var R='baohuy', t=document.getElementById('t');
  var m=location.pathname.match(/^\/[^\/]+\/([A-Za-z0-9]{2,4})\/([A-Za-z0-9]+)\/?$/);
  if(!m){ t.textContent='Không tìm thấy trang.'; return; }
  fetch('/'+R+'/q.json',{cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(map){
    var f=map[m[1].toUpperCase()];
    if(f) location.replace('/'+R+'/m/'+f+'#id='+m[2]); else t.textContent='Không tìm thấy mô hình cho mã '+m[1]+'.';
  }).catch(function(){ t.textContent='Cần có mạng để mở mô hình lần đầu.'; });
})();</script></body></html>
